# Disable both upstream and vendor display/camera allocation paths.
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_DRM is not set
# CONFIG_FB is not set
# CONFIG_FB_CVITEK is not set
# CONFIG_FB_TFT is not set
# CONFIG_BACKLIGHT_CLASS_DEVICE is not set
# CONFIG_LCD_CLASS_DEVICE is not set
# CONFIG_VT is not set
# CONFIG_INPUT_TOUCHSCREEN is not set
# CONFIG_SOUND is not set
# CONFIG_ION is not set
# CONFIG_ION_CVITEK is not set
# CONFIG_CMA is not set
# CONFIG_DMA_CMA is not set

# The second C906 is managed by remoteproc, not Linux SMP or the SDK cmdqueue.
# CONFIG_SMP is not set
# CONFIG_VECTOR is not set
# CONFIG_CVI_MAILBOX is not set
CONFIG_REMOTEPROC=y
CONFIG_REMOTEPROC_CDEV=y
CONFIG_CVITEK_REMOTEPROC=y
CONFIG_MAILBOX=y
CONFIG_CVITEK_MAILBOX=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y

# Rootfs resides on SD, avoiding an initramfs on the 64 MB model.
# CONFIG_BLK_DEV_INITRD is not set
CONFIG_EXT4_FS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_CONFIGFS_FS=y
CONFIG_FW_LOADER=y
CONFIG_CC_OPTIMIZE_FOR_SIZE=y
# CONFIG_DEBUG_INFO is not set
# CONFIG_FTRACE is not set
CONFIG_NET_CORE=y
CONFIG_WIREGUARD=m
CONFIG_NETFILTER=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_NAT=m

