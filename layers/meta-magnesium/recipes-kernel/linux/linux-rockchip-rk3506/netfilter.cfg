# AP routing support is supplied but deliberately left unconfigured. These
# options let nftables provide stateful filtering and IPv4 masquerading when a
# board-specific AP configuration is later added.
CONFIG_NETFILTER=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NFT_CT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_NAT=m
